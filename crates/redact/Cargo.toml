[package]
name = "visionpdf-redact"
description = "Redaction (architecture §11.2): marks, apply (glyphs, images, vectors, XObjects, annotations, fields), verification"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
aho-corasick = "1"
visionpdf-cos = { workspace = true }
visionpdf-content = { workspace = true }
visionpdf-fonts = { workspace = true }
# The usable-quad rule `/QuadPoints` readers share.
visionpdf-geom = { workspace = true }
visionpdf-model = { workspace = true }
visionpdf-forms = { workspace = true }
visionpdf-edit = { workspace = true }
visionpdf-annot = { workspace = true }
visionpdf-xfa = { workspace = true }
# CCITT Group 4 and JBIG2 encoding for cleared one-bit images.
visionpdf-filters = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
# NFKC for the metadata check; already in the build through visionpdf-crypt (stringprep).
unicode-normalization = "0.1"
# Reads the PDF/A and PDF/UA identification by namespace.
craft-xml = { workspace = true }
sha2 = "0.11"

[dev-dependencies]
visionpdf-testkit = { workspace = true }
# The redacted page is rendered in `tests::a_page_whose_pruned_pattern_is_still_selected_renders`:
# layer 3 from layer 4, a dev dependency only.
visionpdf-render = { workspace = true }
