[package]
name = "visionpdf-engine"
description = "VisionPDF engine façade: session, documents, command/tool catalogue"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
craft-docpath = { workspace = true }
craft-image-codecs = { workspace = true }
visionpdf-measure = { workspace = true }
image = { version = "0.25", default-features = false }
visionpdf-render = { workspace = true }
visionpdf-cos = { workspace = true }
visionpdf-organize = { workspace = true }
visionpdf-annot = { workspace = true }
visionpdf-forms = { workspace = true }
visionpdf-xfa = { workspace = true }
visionpdf-edit = { workspace = true }
visionpdf-content = { workspace = true }
visionpdf-audit = { workspace = true }
visionpdf-redact = { workspace = true }
visionpdf-print = { workspace = true }
visionpdf-xfdf = { workspace = true }
visionpdf-sign = { workspace = true }
visionpdf-optimize = { workspace = true }
visionpdf-a11y = { workspace = true }
visionpdf-ocr = { workspace = true }
visionpdf-js = { workspace = true }
visionpdf-compare = { workspace = true }
visionpdf-preflight = { workspace = true }
visionpdf-export = { workspace = true }
visionpdf-fonts = { workspace = true }
visionpdf-create = { workspace = true }
visionpdf-model = { workspace = true }
visionpdf-geom = { workspace = true }
thiserror = { workspace = true }
# Already in the graph (url and idna through webbrowser, icu_properties through boa): they show
# the host of a document's link the way the browser reads it (links::display_host).
url = "2.5"
idna = "1.1"
icu_properties = "2.3"
unicode-segmentation = "1.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Already in the graph through lopdf; used only for the local UTC offset ("today"). The workspace
# entry is std-only; this target adds `clock` for `chrono::Local::now`.
chrono = { workspace = true, features = ["clock"] }
getrandom = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the graph (platform, automation): the rename an automation root confines is made
# below the root's open folder (rename::rooted).
rustix = { version = "1", features = ["fs"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
# Synthetic printer profiles for the app-managed print colour tests.
craft-cms = { workspace = true }
craft-tiff = { workspace = true }
visionpdf-testkit = { workspace = true }
# JBIG2 fixtures (`encode_jbig2_generic`).
visionpdf-filters = { workspace = true }
